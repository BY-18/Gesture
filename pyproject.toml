[project]
name = "gesture-copilot"
version = "0.1.0"
description = "面向自然人机交互的实时代控手势识别 Agent 系统"
# 决策点 D1（Plan V1.0 §8.1）：锁定 3.12 以使用 mediapipe 的 legacy solutions API。
# Python 3.13/3.14 仅提供 mediapipe >= 0.10.30 / 1.x，其 mediapipe.solutions 已被移除。
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26,<2.0",
    "opencv-python>=4.8,<5.0",
    # 必须锁 0.10.21：0.10.30+/1.x 已移除 legacy API（mp.solutions.hands）
    "mediapipe==0.10.21",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# 工作区内缓存，避免污染用户级目录。
# 解释器目录需通过环境变量指定（uv 不支持在 pyproject 中配置）：
#   UV_PYTHON_INSTALL_DIR=.pythons
cache-dir = ".uv-cache"
